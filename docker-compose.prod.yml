# Production stack: TLS-terminating proxy, static frontend, no dev servers.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Requires DOMAIN and ADMIN_TOKEN in .env. Run the migrations once the backend
# is up: docker compose -f docker-compose.prod.yml exec backend alembic upgrade head

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neo_premiership}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-neo_premiership}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Deliberately no `ports:`. Only the backend needs the database, and it
    # reaches it over the internal compose network. Publishing 5432 would put
    # Postgres on the public interface.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neo_premiership} -d ${POSTGRES_DB:-neo_premiership}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-neo_premiership}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-neo_premiership}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN - admin writes fail closed without it}
      # Same-origin via Caddy, so this only matters if you split the API onto
      # its own subdomain.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN}}
    depends_on:
      db:
        condition: service_healthy
    # No published port: Caddy reaches it on the internal network.
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Empty => the app calls /api on its own origin, which Caddy routes to
        # the backend. Set this only if the API lives on another host.
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the site's hostname, e.g. pokemonpremiership.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates must persist, or every restart re-requests them and you
      # will hit Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
