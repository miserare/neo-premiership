server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx version.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Hashed build assets are immutable; the font and images are stable too.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # THE critical line for a single-page app: any path that isn't a real file
    # has to fall back to index.html, or refreshing /seasons/<id> returns 404
    # instead of letting the client router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or clients keep loading an old
    # build that references deleted asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
