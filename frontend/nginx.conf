# Serves the compiled SPA. Sits behind Caddy on the internal Docker network and
# is never reachable from the internet directly.
#
# Listens on 8080, not 80, so the process can run unprivileged without
# NET_BIND_SERVICE.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Container healthcheck target. Answered without touching the filesystem.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Build assets carry a content hash in the filename, so they can be cached
    # indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html must never be cached, or a client keeps loading an old build
    # that references asset hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # THE critical line for a single-page app: any path that is not a real file
    # falls back to index.html, so refreshing /seasons/<id> is handled by the
    # client router instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
