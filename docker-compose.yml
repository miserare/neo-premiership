services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neo_premiership}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neo_premiership}
      POSTGRES_DB: ${POSTGRES_DB:-neo_premiership}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback-only, so the database is reachable from this machine for psql
      # or a GUI client but never from the network. Non-default host port so it
      # doesn't collide with a Postgres already installed on the host - connect
      # with `psql -h localhost -p 55432`. docker-compose.prod.yml publishes no
      # database port at all.
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neo_premiership} -d ${POSTGRES_DB:-neo_premiership}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # Opt in explicitly - settings.environment defaults to "production" so a
      # deployment can never fall into development behaviour (SQL echo) by
      # forgetting to set it.
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-neo_premiership}:${POSTGRES_PASSWORD:-neo_premiership}@db:5432/${POSTGRES_DB:-neo_premiership}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173"]}'
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      # Consumed by the browser at runtime, so it must point at a host-reachable
      # URL (the published backend port), not the internal "backend" service name.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
