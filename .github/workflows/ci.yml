name: CI

on:
  push:
    branches: [main, "release/**", "feat/**"]
  pull_request:
    branches: [main]

# A push that supersedes an in-flight run cancels it rather than queueing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    services:
      postgres:
        # Migrations are tested against real PostgreSQL, not SQLite: SQLite does
        # not enforce foreign keys, so ON DELETE behaviour and partial unique
        # indexes cannot be verified there.
        image: postgres:15.14-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app/ tests/ seeds/

      - name: Tests
        working-directory: backend
        env:
          ENVIRONMENT: development
        run: python -m pytest -q

      - name: Alembic has exactly one head
        working-directory: backend
        env:
          ENVIRONMENT: development
        run: |
          heads=$(alembic heads | grep -c "(head)")
          echo "alembic heads: $heads"
          if [ "$heads" -ne 1 ]; then
            echo "::error::expected exactly one alembic head, found $heads (a branched history needs a merge revision)"
            alembic heads
            exit 1
          fi

      - name: Migrations apply to an empty PostgreSQL database
        working-directory: backend
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
        run: |
          alembic upgrade head
          # Downgrade then re-upgrade, so a one-way migration is caught here
          # rather than during an incident.
          alembic downgrade -1
          alembic upgrade head

      - name: Models match migrations (no un-migrated schema drift)
        working-directory: backend
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
        run: |
          alembic check || {
            echo "::error::models and migrations disagree - run 'alembic revision --autogenerate'"
            exit 1
          }

      # Last, because these drop and rebuild the schema in the database above.
      - name: Migrations convert legacy data correctly
        working-directory: backend
        env:
          ENVIRONMENT: development
          MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
        run: python -m pytest tests/test_playoff_round_migration.py -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Bundle contains no development URL or credential
        working-directory: frontend
        run: |
          fail=0
          for pattern in 'localhost:' '127\.0\.0\.1' 'X-Admin-Token' 'dev-admin-token' 'SESSION_SECRET'; do
            if grep -rqE "$pattern" dist/assets/; then
              echo "::error::built bundle contains '$pattern'"
              fail=1
            fi
          done
          exit $fail

  images:
    name: Production images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose files are valid
        env:
          DOMAIN: example.com
          POSTGRES_USER: ci
          POSTGRES_DB: ci
        run: |
          mkdir -p secrets
          echo placeholder > secrets/session_secret
          echo placeholder > secrets/postgres_password
          docker compose -f docker-compose.prod.yml config >/dev/null
          docker compose -f docker-compose.yml config >/dev/null
          rm -rf secrets

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan can inspect every commit, not just
          # the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependency vulnerabilities
        working-directory: backend
        run: |
          pip install --quiet pip-audit
          # Reports advisories without failing the build on an unfixable
          # transitive finding; review the output on every run.
          pip-audit -r requirements.txt --desc || true
          # Runtime dependencies with a KNOWN FIX must not ship.
          pip-audit -r requirements.txt --fix --dry-run

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No secret files or .env committed
        run: |
          fail=0
          # .env.example / .env.production.example are templates and allowed.
          if git ls-files | grep -E '(^|/)\.env$|(^|/)secrets/|\.pem$|\.key$'; then
            echo "::error::a secret file is tracked in git"
            fail=1
          fi
          exit $fail
